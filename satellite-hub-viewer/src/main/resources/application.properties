spring.application.name=satellite-hub-viewer
spring.thymeleaf.cache=false

infinitestack.plugin.id=satellite-hub-viewer
infinitestack.plugin.base-path=${IS_PLUGIN_BASE_PATH:/api/plugins/satellite-hub-viewer}
infinitestack.plugin.assets-path=${infinitestack.plugin.base-path}/assets
infinitestack.plugin.data-root=${IS_PLUGIN_INSTALL_PATH:./data}

infinitestack.destination.db=${IS_DESTINATION_DB:postgres}

spring.datasource.url=${IS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${IS_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${IS_DATASOURCE_PASSWORD:32329954}
spring.datasource.driver-class-name=org.postgresql.Driver

infinitestack.host.base-url=${IS_HOST_BASE_URL:http://127.0.0.1:8081}
infinitestack.plugin.internal-token=${IS_PLUGIN_INTERNAL_TOKEN:}
infinitestack.plugin.runtime-id=${IS_PLUGIN_ID:satellite-hub-viewer}
infinitestack.active-llm.provider=${IS_ACTIVE_LLM_PROVIDER:}
infinitestack.active-llm.model=${IS_ACTIVE_LLM_MODEL:o4-mini}
infinitestack.active-llm.credential-key=${IS_ACTIVE_LLM_CREDENTIAL_KEY:}

# ── Satellite Hub Viewer schema mapping (ajustar se a DDL real divergir) ──
satellite.areas.table=${SAT_AREAS_TABLE:gold.satellite_hub_areas}
satellite.images.table=${SAT_IMAGES_TABLE:gold.satellite_hub_images}
satellite.images_areas.table=${SAT_IMAGES_AREAS_TABLE:gold.satellite_hub_images_areas}

# Tile server que reprojeta o COG (visual_url) para Web Mercator e serve tiles ao MapLibre.
# Default: instância pública TiTiler. Aponte para sua própria instância em produção.
satellite.cog.tiler=${SAT_COG_TILER:https://titiler.xyz}

server.error.include-message=always
