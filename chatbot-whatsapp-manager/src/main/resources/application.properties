spring.application.name=chatbot-whatsapp-manager
spring.thymeleaf.cache=false

infinitestack.plugin.id=chatbot-whatsapp-manager
infinitestack.plugin.base-path=${IS_PLUGIN_BASE_PATH:/api/plugins/chatbot-whatsapp-manager}
infinitestack.plugin.assets-path=${infinitestack.plugin.base-path}/assets
infinitestack.plugin.data-root=${IS_PLUGIN_INSTALL_PATH:./data}

# Prefixo da API do host, chamado pelo NAVEGADOR do operador (mesma origem, sessão dele).
# Este app não guarda dado próprio nem credencial: ele lê e envia pelas rotas do IS.
infinitestack.host.api-path=${IS_HOST_API_PATH:/api}

infinitestack.host.base-url=${IS_HOST_BASE_URL:http://127.0.0.1:8081}
infinitestack.plugin.internal-token=${IS_PLUGIN_INTERNAL_TOKEN:}
infinitestack.plugin.runtime-id=${IS_PLUGIN_ID:chatbot-whatsapp-manager}

# Banco de destino do IS — onde o transcript das conversas é guardado.
spring.datasource.url=${IS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${IS_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${IS_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O pool não pode segurar o boot: com o banco fora do ar o app ainda tem que subir e
# responder /api/runtime-health, senão o IS aborta a instalação.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

# Quantas mensagens o painel carrega de uma conversa por vez.
chatbot.whatsapp.page-size=500

# Tamanho máximo de anexo aceito no upload do painel (o multipart do Spring).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.error.include-message=always
