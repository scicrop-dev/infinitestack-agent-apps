spring.application.name=chat-app
spring.thymeleaf.cache=false

infinitestack.plugin.id=chat-app
infinitestack.plugin.base-path=${IS_PLUGIN_BASE_PATH:/api/plugins/chat-app}
infinitestack.plugin.assets-path=${infinitestack.plugin.base-path}/assets
infinitestack.plugin.data-root=${IS_PLUGIN_INSTALL_PATH:./data}

infinitestack.destination.db=${IS_DESTINATION_DB:postgres}

spring.datasource.url=${IS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${IS_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${IS_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# O pool não pode segurar o boot: se o banco do cliente estiver fora do ar, o app
# ainda tem que subir e responder /api/runtime-health, senão o IS aborta a instalação.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

infinitestack.host.base-url=${IS_HOST_BASE_URL:http://127.0.0.1:8081}
infinitestack.plugin.internal-token=${IS_PLUGIN_INTERNAL_TOKEN:}
infinitestack.plugin.runtime-id=${IS_PLUGIN_ID:chat-app}
infinitestack.active-llm.provider=${IS_ACTIVE_LLM_PROVIDER:}
infinitestack.active-llm.model=${IS_ACTIVE_LLM_MODEL:o4-mini}
infinitestack.active-llm.credential-key=${IS_ACTIVE_LLM_CREDENTIAL_KEY:}

# Teto de nós percorridos em um único turno — trava de loop infinito em fluxo mal formado.
chatapp.engine.max-steps-per-turn=50

server.error.include-message=always

# ── Ações de efeito (fase 3) ────────────────────────────────────────────────
# Banco: ligado, mas somente leitura e parametrizado — quem protege é o SqlGuard,
# não o interruptor. Ver docs/006-actions.md.
chatapp.actions.db.enabled=${CHATAPP_DB_ACTIONS_ENABLED:true}
chatapp.actions.db.max-rows=100
chatapp.actions.db.timeout-seconds=5

# HTTP: desligado por padrão e inútil sem allowlist — instalação air-gapped é
# cenário real no IS, e chamada externa é saída de dados do perímetro.
chatapp.actions.http.enabled=${CHATAPP_HTTP_ACTIONS_ENABLED:false}
chatapp.actions.http.allowed-hosts=${CHATAPP_HTTP_ALLOWED_HOSTS:}
chatapp.actions.http.timeout-seconds=10
chatapp.actions.http.max-response-bytes=262144

# Teto de profundidade de subfluxos (fase 5) — trava de recursão entre fluxos.
chatapp.engine.max-call-depth=10
